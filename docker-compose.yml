  postgres:
    image: postgres:15-alpine
    container_name: infinit-null-postgres
    environment:
      POSTGRES_DB: infinit_null
      POSTGRES_USER: infinit_user
      POSTGRES_PASSWORD: SecurePass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinit_user"]
      interval: 10s
      timeout: 5s
      retries: 5
