global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['localhost:8001']

  - job_name: 'threat-detection'
    static_configs:
      - targets: ['localhost:8002']
