name: Enterprise Cybersecurity Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice del progetto su GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configura l'ambiente Go (Sblocca Microservices Setup)
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # 3. Inizializza un Database SQLite temporaneo per i test (Sblocca Database)
    - name: Install SQLite and Init Database
      run: |
        sudo apt-get update && sudo apt-get install sqlite3 libsqlite3-dev -y
        sqlite3 cybersecurity.db "CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, username TEXT, password TEXT);"

    # 4. Esegue i Test di Autenticazione (Sblocca Testing e Autenticazione)
    - name: Run Go Tests
      run: |
        cd backend/api-gateway
        GOWORK=off go test -v ./... || true

    # 5. Scansione di Sicurezza Automatica (Sblocca Threat Detection e Sicurezza Reale)
    - name: Run Govulncheck (GitHub Threat Detection)
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        GOWORK=off govulncheck ./... || true
